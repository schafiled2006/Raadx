<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raad Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Vazirmatn', sans-serif;
    background: #0d0d0d;
    color: #e8e8e8;
    min-height: 100vh;
    direction: rtl;
  }
  .header {
    background: #111;
    border-bottom: 0.5px solid #222;
    padding: 0 32px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-family: Georgia, serif;
    font-size: 22px;
    color: #4ade80;
    font-style: italic;
    letter-spacing: 1px;
  }
  .logo span {
    font-size: 11px;
    color: #666;
    font-style: normal;
    font-family: 'Vazirmatn', sans-serif;
    margin-right: 8px;
    background: #1a1a1a;
    border: 0.5px solid #333;
    padding: 2px 8px;
    border-radius: 4px;
  }
  .tabs {
    display: flex;
    gap: 4px;
  }
  .tab {
    padding: 6px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: #888;
    background: transparent;
    border: none;
    transition: all 0.15s;
  }
  .tab:hover { color: #ccc; background: #1a1a1a; }
  .tab.active { color: #fff; background: #1f1f1f; }

  .main { padding: 32px; max-width: 900px; margin: 0 auto; }

  .section { display: none; }
  .section.active { display: block; }

  .card {
    background: #161616;
    border: 0.5px solid #222;
    border-radius: 12px;
    padding: 28px;
  }
  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title .dot {
    width: 6px; height: 6px;
    background: #4ade80;
    border-radius: 50%;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .form-group.full { grid-column: 1 / -1; }
  label {
    font-size: 12px;
    color: #888;
    font-weight: 500;
  }
  input, select, textarea {
    background: #1a1a1a;
    border: 0.5px solid #2a2a2a;
    border-radius: 8px;
    color: #e8e8e8;
    font-size: 14px;
    padding: 10px 12px;
    font-family: 'Vazirmatn', sans-serif;
    transition: border-color 0.15s;
    width: 100%;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: #4ade80;
  }
  select option { background: #1a1a1a; }

  .upload-zone {
    border: 1.5px dashed #2a2a2a;
    border-radius: 10px;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    background: #111;
  }
  .upload-zone:hover { border-color: #4ade80; background: #0f1a11; }
  .upload-zone.has-file { border-color: #4ade80; background: #0f1a11; }
  .upload-zone input[type=file] {
    position: absolute; inset: 0;
    opacity: 0; cursor: pointer;
    width: 100%; height: 100%;
  }
  .upload-icon { font-size: 28px; margin-bottom: 8px; }
  .upload-label { font-size: 13px; color: #888; }
  .upload-label strong { color: #4ade80; }
  .file-name {
    font-size: 12px;
    color: #4ade80;
    margin-top: 6px;
    word-break: break-all;
  }

  .progress-bar {
    height: 4px;
    background: #222;
    border-radius: 2px;
    overflow: hidden;
    margin-top: 8px;
  }
  .progress-fill {
    height: 100%;
    background: #4ade80;
    border-radius: 2px;
    transition: width 0.3s;
    width: 0%;
  }

  .btn {
    padding: 11px 24px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    font-family: 'Vazirmatn', sans-serif;
  }
  .btn-primary {
    background: #4ade80;
    color: #0d1a0f;
    width: 100%;
    margin-top: 20px;
  }
  .btn-primary:hover { background: #22c55e; }
  .btn-primary:disabled { background: #1f3d28; color: #4a7a5c; cursor: not-allowed; }

  .alert {
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    margin-top: 16px;
    display: none;
  }
  .alert.success { background: #0f2d16; border: 0.5px solid #166534; color: #4ade80; display: block; }
  .alert.error { background: #2d0f0f; border: 0.5px solid #7f1d1d; color: #f87171; display: block; }

  .songs-list { display: flex; flex-direction: column; gap: 10px; }
  .song-item {
    background: #1a1a1a;
    border: 0.5px solid #222;
    border-radius: 10px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .song-cover {
    width: 46px; height: 46px;
    border-radius: 6px;
    object-fit: cover;
    background: #222;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    overflow: hidden;
  }
  .song-cover img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
  .song-info { flex: 1; min-width: 0; }
  .song-title { font-size: 14px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-meta { font-size: 12px; color: #666; margin-top: 2px; }
  .song-genre {
    font-size: 11px;
    background: #1f3d28;
    color: #4ade80;
    padding: 3px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .song-delete {
    background: none;
    border: none;
    color: #555;
    cursor: pointer;
    padding: 6px;
    border-radius: 6px;
    font-size: 16px;
    transition: all 0.15s;
  }
  .song-delete:hover { color: #f87171; background: #2d0f0f; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #444;
  }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat {
    background: #1a1a1a;
    border: 0.5px solid #222;
    border-radius: 10px;
    padding: 16px;
    text-align: center;
  }
  .stat-num { font-size: 28px; font-weight: 700; color: #4ade80; }
  .stat-label { font-size: 11px; color: #555; margin-top: 2px; }

  .loading-spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid transparent;
    border-top-color: #0d1a0f;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-left: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <div class="logo">Raad <span>پنل ادمین</span></div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('upload')">آپلود آهنگ</button>
    <button class="tab" onclick="switchTab('list')">لیست آهنگ‌ها</button>
  </div>
</div>

<div class="main">

  <div id="tab-upload" class="section active">
    <div class="card">
      <div class="card-title"><span class="dot"></span>افزودن آهنگ جدید</div>
      <div class="form-grid">
        <div class="form-group">
          <label>عنوان آهنگ *</label>
          <input id="song-title" type="text" placeholder="مثل: خواب‌های طلایی">
        </div>
        <div class="form-group">
          <label>نام آرتیست *</label>
          <input id="artist" type="text" placeholder="مثل: کیوان ساکت">
        </div>
        <div class="form-group">
          <label>آلبوم</label>
          <input id="album" type="text" placeholder="نام آلبوم (اختیاری)">
        </div>
        <div class="form-group">
          <label>ژانر</label>
          <select id="genre">
            <option value="">انتخاب ژانر</option>
            <option value="پاپ">پاپ</option>
            <option value="راک">راک</option>
            <option value="جاز">جاز</option>
            <option value="کلاسیک">کلاسیک</option>
            <option value="الکترونیک">الکترونیک</option>
            <option value="هیپ‌هاپ">هیپ‌هاپ</option>
            <option value="آر اند بی">آر اند بی</option>
            <option value="سنتی ایرانی">سنتی ایرانی</option>
            <option value="پاپ ایرانی">پاپ ایرانی</option>
            <option value="سایر">سایر</option>
          </select>
        </div>

        <div class="form-group full">
          <label>فایل آهنگ (MP3) *</label>
          <div class="upload-zone" id="audio-zone">
            <input type="file" id="audio-file" accept="audio/mp3,audio/mpeg">
            <div class="upload-icon">🎵</div>
            <div class="upload-label">فایل MP3 را اینجا رها کنید یا <strong>انتخاب کنید</strong></div>
            <div class="file-name" id="audio-name"></div>
            <div class="progress-bar" id="audio-progress" style="display:none">
              <div class="progress-fill" id="audio-fill"></div>
            </div>
          </div>
        </div>

        <div class="form-group full">
          <label>تصویر کاور</label>
          <div class="upload-zone" id="cover-zone">
            <input type="file" id="cover-file" accept="image/*">
            <div class="upload-icon">🖼️</div>
            <div class="upload-label">تصویر کاور را انتخاب کنید <strong>(اختیاری)</strong></div>
            <div class="file-name" id="cover-name"></div>
          </div>
        </div>
      </div>

      <div id="alert-box" class="alert"></div>
      <button class="btn btn-primary" id="submit-btn" onclick="uploadSong()">آپلود آهنگ</button>
    </div>
  </div>

  <div id="tab-list" class="section">
    <div class="stat-grid" id="stats">
      <div class="stat"><div class="stat-num" id="stat-total">—</div><div class="stat-label">کل آهنگ‌ها</div></div>
      <div class="stat"><div class="stat-num" id="stat-artists">—</div><div class="stat-label">آرتیست‌ها</div></div>
      <div class="stat"><div class="stat-num" id="stat-albums">—</div><div class="stat-label">آلبوم‌ها</div></div>
    </div>
    <div class="card">
      <div class="card-title"><span class="dot"></span>آهنگ‌های آپلود شده</div>
      <div id="songs-container" class="songs-list">
        <div class="empty-state"><div class="icon">🎶</div><p>در حال بارگذاری...</p></div>
      </div>
    </div>
  </div>

</div>

<script>
const SUPABASE_URL = 'https://jxyyvqkmyeythspvnwid.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Qlw9rzbRm6VhDHmIk3SzUA_uxSpO6sf';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const AUDIO_BUCKET = 'songs';
const COVER_BUCKET = 'covers';
const TABLE = 'songs';

document.getElementById('audio-file').addEventListener('change', function() {
  const f = this.files[0];
  if (f) {
    document.getElementById('audio-name').textContent = f.name;
    document.getElementById('audio-zone').classList.add('has-file');
  }
});
document.getElementById('cover-file').addEventListener('change', function() {
  const f = this.files[0];
  if (f) {
    document.getElementById('cover-name').textContent = f.name;
    document.getElementById('cover-zone').classList.add('has-file');
  }
});

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
  if (tab === 'list') loadSongs();
}

function showAlert(msg, type) {
  const el = document.getElementById('alert-box');
  el.textContent = msg;
  el.className = 'alert ' + type;
  if (type === 'success') setTimeout(() => el.className = 'alert', 4000);
}

function slug() {
  return Date.now() + '_' + Math.random().toString(36).slice(2, 7);
}

async function uploadSong() {
  const title = document.getElementById('song-title').value.trim();
  const artist = document.getElementById('artist').value.trim();
  const album = document.getElementById('album').value.trim();
  const genre = document.getElementById('genre').value;
  const audioFile = document.getElementById('audio-file').files[0];
  const coverFile = document.getElementById('cover-file').files[0];

  if (!title || !artist || !audioFile) {
    showAlert('⚠️ عنوان، آرتیست و فایل MP3 الزامی هستند.', 'error');
    return;
  }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.innerHTML = 'در حال آپلود<span class="loading-spinner"></span>';

  const prog = document.getElementById('audio-progress');
  const fill = document.getElementById('audio-fill');
  prog.style.display = 'block';

  try {
    fill.style.width = '20%';
    const audioPath = slug() + '_' + audioFile.name.replace(/\s/g, '_');
    const { error: audioErr } = await db.storage.from(AUDIO_BUCKET).upload(audioPath, audioFile);
    if (audioErr) throw new Error('خطا در آپلود فایل صوتی: ' + audioErr.message);
    fill.style.width = '60%';

    const { data: audioData } = db.storage.from(AUDIO_BUCKET).getPublicUrl(audioPath);
    const audioUrl = audioData.publicUrl;

    let coverUrl = null;
    if (coverFile) {
      const coverPath = slug() + '_' + coverFile.name.replace(/\s/g, '_');
      const { error: covErr } = await db.storage.from(COVER_BUCKET).upload(coverPath, coverFile);
      if (covErr) throw new Error('خطا در آپلود تصویر: ' + covErr.message);
      const { data: covData } = db.storage.from(COVER_BUCKET).getPublicUrl(coverPath);
      coverUrl = covData.publicUrl;
    }

    fill.style.width = '80%';

    const { error: dbErr } = await db.from(TABLE).insert({
      title,
      artist,
      album: album || null,
      genre: genre || null,
      audio_url: audioUrl,
      cover_url: coverUrl,
      created_at: new Date().toISOString()
    });
    if (dbErr) throw new Error('خطا در ذخیره اطلاعات: ' + dbErr.message);

    fill.style.width = '100%';
    showAlert('✅ آهنگ «' + title + '» با موفقیت آپلود شد!', 'success');
    document.getElementById('song-title').value = '';
    document.getElementById('artist').value = '';
    document.getElementById('album').value = '';
    document.getElementById('genre').value = '';
    document.getElementById('audio-file').value = '';
    document.getElementById('cover-file').value = '';
    document.getElementById('audio-name').textContent = '';
    document.getElementById('cover-name').textContent = '';
    document.getElementById('audio-zone').classList.remove('has-file');
    document.getElementById('cover-zone').classList.remove('has-file');
    setTimeout(() => { prog.style.display = 'none'; fill.style.width = '0%'; }, 1000);

  } catch(e) {
    showAlert('❌ ' + e.message, 'error');
    prog.style.display = 'none';
    fill.style.width = '0%';
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'آپلود آهنگ';
  }
}

async function loadSongs() {
  const container = document.getElementById('songs-container');
  container.innerHTML = '<div class="empty-state"><div class="icon">⏳</div><p>در حال بارگذاری...</p></div>';

  const { data, error } = await db.from(TABLE).select('*').order('created_at', { ascending: false });

  if (error) {
    container.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>خطا در بارگذاری: ' + error.message + '</p></div>';
    return;
  }

  document.getElementById('stat-total').textContent = data.length;
  const artists = new Set(data.map(s => s.artist)).size;
  const albums = new Set(data.filter(s => s.album).map(s => s.album)).size;
  document.getElementById('stat-artists').textContent = artists;
  document.getElementById('stat-albums').textContent = albums;

  if (!data.length) {
    container.innerHTML = '<div class="empty-state"><div class="icon">🎶</div><p>هنوز هیچ آهنگی آپلود نشده</p></div>';
    return;
  }

  container.innerHTML = data.map(s => `
    <div class="song-item" id="song-${s.id}">
      <div class="song-cover">
        ${s.cover_url ? `<img src="${s.cover_url}" alt="cover" onerror="this.parentNode.innerHTML='🎵'">` : '🎵'}
      </div>
      <div class="song-info">
        <div class="song-title">${s.title}</div>
        <div class="song-meta">${s.artist}${s.album ? ' · ' + s.album : ''}</div>
      </div>
      ${s.genre ? `<span class="song-genre">${s.genre}</span>` : ''}
      <button class="song-delete" onclick="deleteSong('${s.id}', '${(s.audio_url||'').split('/').pop()}', '${(s.cover_url||'').split('/').pop()}')" title="حذف">✕</button>
    </div>
  `).join('');
}

async function deleteSong(id, audioFile, coverFile) {
  if (!confirm('آیا مطمئنی؟ این آهنگ حذف خواهد شد.')) return;

  const { error } = await db.from(TABLE).delete().eq('id', id);
  if (error) { alert('خطا در حذف: ' + error.message); return; }

  if (audioFile) await db.storage.from(AUDIO_BUCKET).remove([audioFile]);
  if (coverFile && coverFile !== 'null') await db.storage.from(COVER_BUCKET).remove([coverFile]);

  document.getElementById('song-' + id)?.remove();
  const remaining = document.querySelectorAll('.song-item').length;
  document.getElementById('stat-total').textContent = remaining;
  if (!remaining) {
    document.getElementById('songs-container').innerHTML = '<div class="empty-state"><div class="icon">🎶</div><p>هیچ آهنگی باقی نمانده</p></div>';
  }
}
</script>
</body>
</html>
